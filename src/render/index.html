<!DOCTYPE html>
  <html>

  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Griphite</title>

    <script src="./marked.js" defer></script>
    <script src="./script.js" defer></script>

    <link href="./global.css" rel="stylesheet" />
  </head>

  <body>
    <div id="fs">
      <div id="actions">
        <button id="createFile"></button>
        <button id="createFolder"></button>
      </div>
    </div>

    <div id="note">
      <textarea id="edit" spellcheck="true">Just like griphite, write what ever, when ever, where ever you want.</textarea>

      <div id="preview"></div>
    </div>

    <dialog id="prefrences" popover="auto">
        <h2>Prefrences</h2>

        <label for="theme">UI Theme</label>
        <select name="theme" id="theme" class="prefrenceSetting">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="sys">System</option>
        </select>
    </dialog>
  </body>
</html>
